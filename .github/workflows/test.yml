name: Test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # catches a JevGate release that breaks the action
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key kinds
        shell: bash
        run: bash test/key-kinds.sh
      - name: Comment
        shell: bash
        run: node --test test/render.test.cjs test/comment.test.cjs
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A dry run needs no key or network access beyond the download, and
      # checks install, PATH, --base and the exit code.
      - id: jevgate
        uses: ./
        with:
          args: --dry-run
          cache: "false"
          sarif-file: jevgate.sarif
      - name: Check the outputs
        shell: bash
        env:
          CODE: ${{ steps.jevgate.outputs.exit-code }}
        run: |
          [ "$CODE" = 0 ] || { echo "::error::exit code $CODE"; exit 1; }
          jevgate --version
          grep -q '"version": "2.1.0"' jevgate.sarif || { echo "::error::no SARIF log"; exit 1; }
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A change whose answers no cache holds: --cache-only writes a report
      # and ends incomplete, with no key and nothing sent.
      - name: Create a repository to check
        shell: bash
        run: bash test/fixture-repository.sh fixture
      - id: incomplete
        uses: ./
        continue-on-error: true
        with:
          working-directory: fixture
          base: HEAD~1
          args: --cache-only
          cache: "false"
      # Nothing changed since HEAD: the gate passes. On a pull request the
      # read-only token cannot comment, which must not fail the step.
      - id: passed
        uses: ./
        with:
          working-directory: fixture
          base: HEAD
          cache: "false"
      - name: Check the outputs
        shell: bash
        env:
          INCOMPLETE: ${{ steps.incomplete.outputs.exit-code }}
          PASSED: ${{ steps.passed.outputs.exit-code }}
          REPORT: ${{ steps.incomplete.outputs.report }}
        run: |
          [ "$INCOMPLETE" = 2 ] || { echo "::error::exit code $INCOMPLETE, not 2"; exit 1; }
          [ "$PASSED" = 0 ] || { echo "::error::exit code $PASSED, not 0"; exit 1; }
          # The path must open outside bash too, as upload-artifact opens it.
          node -e 'require("fs").accessSync(process.argv[1])' "$REPORT" || { echo "::error::no report at $REPORT"; exit 1; }
  comment:
    # It writes to the pull request, so only where the token may.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a repository to check
        shell: bash
        run: bash test/fixture-repository.sh fixture
      # Two checks in one job share one comment: the second replaces the first.
      - uses: ./
        with:
          working-directory: fixture
          base: HEAD
          cache: "false"
      - uses: ./
        continue-on-error: true
        with:
          working-directory: fixture
          base: HEAD~1
          args: --cache-only
          cache: "false"
      - name: Check the comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          bodies=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- jevgate-action comment key=comment%20fixture "))) | .body | @json')
          [ "$(grep -c . <<< "$bodies")" = 1 ] || { echo "::error::expected one comment: $bodies"; exit 1; }
          grep -q 'JevGate could not finish this run (exit code 2)' <<< "$bodies" || { echo "::error::no banner: $bodies"; exit 1; }
